
    
  
name: Deploy Microservices

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Microservices Images
        run: |
          docker build -t alan0o0s/multi-client:latest ./microservices/client
          docker build -t alan0o0s/multi-nginx:latest ./microservices/nginx
          docker build -t alan0o0s/multi-server:latest ./microservices/server
          docker build -t alan0o0s/multi-worker:latest ./microservices/worker

      - name: Push Images to Docker Hub
        run: |
          docker push alan0o0s/multi-client:latest
          docker push alan0o0s/multi-nginx:latest
          docker push alan0o0s/multi-server:latest
          docker push alan0o0s/multi-worker:latest


